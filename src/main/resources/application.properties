spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# HIBERNATE BATCHING
# ===============================
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===============================
# SCHEDULER THREAD POOL
# ===============================
# Allow multiple scheduled tasks to run concurrently (default is 1 which causes delays)
spring.task.scheduling.pool.size=5

# ===============================
# DATASOURCE CONNECTION POOL (HikariCP)
# ===============================
# Leak detection threshold (ms). Set higher than the longest expected saveAll() batch duration.
# With IDENTITY generation, Hibernate cannot batch inserts, so large saves take time.
# 5 minutes = 300000ms. Anything held longer than this is a genuine leak.
spring.datasource.hikari.leak-detection-threshold=300000
# Maximum time (ms) to wait for a connection from the pool
spring.datasource.hikari.connection-timeout=30000
# Maximum idle time (ms) for a connection before it's retired
spring.datasource.hikari.idle-timeout=600000
# Maximum lifetime (ms) of a connection in the pool
spring.datasource.hikari.max-lifetime=1800000
# Maximum number of connections in the pool
spring.datasource.hikari.maximum-pool-size=20
# Allow app to start even if DB is temporarily unavailable (retry lazily)
spring.datasource.hikari.initialization-fail-timeout=-1